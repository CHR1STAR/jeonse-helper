<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전세계약 도우미</title>
<style>
:root{color-scheme:light;--blue:#215bea;--ink:#142443;--muted:#52627b;--border:#dce5f2;--wash:#edf3ff;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 system-ui,sans-serif}
header,main{max-width:960px;margin:auto;padding:20px clamp(16px,4vw,36px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
main{padding-top:12px;padding-bottom:48px}
small,.muted{color:var(--muted)} p{margin:8px 0 16px}
h1,h2,h3{line-height:1.24;margin:0 0 10px;overflow-wrap:anywhere} h1{font-size:clamp(26px,5vw,38px)}
h2{font-size:22px} h3{font-size:17px}
button,input,select,textarea{font:inherit} button{cursor:pointer}
button{min-height:44px;padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--paper);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6d9bff;outline-offset:2px}
.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}
.back{margin-bottom:16px}
.badge{background:var(--wash);color:#1749bd;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:650;display:inline-block}
.panel{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:clamp(16px,4vw,28px);margin-bottom:16px}
.guide{max-width:640px;margin-inline:auto}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.property-actions{display:grid;justify-items:center;gap:10px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
fieldset{margin:14px 0;border:1px solid var(--border);border-radius:12px;padding:10px 14px}
legend{font-weight:650;padding:0 5px}
label:not(.inline){display:grid;gap:5px;margin:0 0 12px}
label.inline{display:inline-flex;align-items:center;gap:7px;min-height:44px}
input:not([type=checkbox]),select,textarea{min-height:44px;width:100%;min-width:0;padding:8px;border:1px solid #aebed7;border-radius:9px;background:white;color:var(--ink)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue)}
.note{background:var(--wash);padding:14px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}
.status{min-height:25px;margin-top:8px;color:#1749bd}
.account-controls{display:flex;align-items:center;gap:10px}
.account-form{margin-top:18px}
.sign-in,.sign-in input,.sign-in .choices button{text-align:center}
.sign-in .row{justify-content:center}
.sign-in input::placeholder{color:#64748b;opacity:1}
.sign-in input:focus::placeholder{color:transparent}
#account-button[hidden]{display:none}
.account-message{margin:12px 0;overflow-wrap:anywhere}
#guest-dialog{width:min(calc(100% - 32px),400px);padding:24px;border:1px solid var(--border);border-radius:16px;color:var(--ink)}
#guest-dialog::backdrop{background:#14244366}
#guest-dialog .guest-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#contract-dialog{width:min(calc(100% - 32px),400px);max-width:none;padding:24px;border:1px solid var(--border);border-radius:18px;background:var(--paper);color:var(--ink)}
#contract-dialog::backdrop{background:#14244366}
#contract-dialog[open]{animation:arrive 180ms ease-out}
#contract-dialog .contract-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
#contract-dialog .contract-actions button{min-height:48px}
@media(prefers-reduced-motion:reduce){#contract-dialog[open]{animation:none}}
.previous-step{margin-top:14px}
.task-done{position:relative;animation:task-fade 450ms 200ms ease both}
.task-done::after{content:'🎉';position:absolute;inset:0;display:grid;place-items:center;font-size:32px;pointer-events:none;animation:task-burst 600ms ease-out both}
@keyframes task-fade{to{opacity:0}}
@keyframes task-burst{from{opacity:0;transform:scale(.55)}35%{opacity:1;transform:translateY(-5px) scale(1.18)}to{opacity:0;transform:translateY(-22px) scale(1)}}
.toast:not(:empty){position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);z-index:5;padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;pointer-events:none}
.field-error{color:#aa2532;font-size:14px}
input[aria-invalid=true]{border-color:#aa2532}
.resume{margin-top:16px}
.resume p{margin:6px 0 0}
.contract-banner{margin-top:16px;border-inline-start:3px solid var(--blue);padding:12px 14px;background:var(--wash);border-radius:8px}
.contract-banner p{margin:0 0 8px}
.compare-table .badge{display:inline-block;margin:4px 0}
.compare-sheet{box-sizing:border-box;position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,500px);max-width:none;max-height:85dvh;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--border);border-radius:18px 18px 0 0;background:var(--paper);color:var(--ink)}
.compare-sheet::backdrop{background:#14244366}
.compare-sheet[open]{animation:sheet-in 180ms ease-out}
.compare-sheet form{display:grid;gap:8px}
.compare-sheet .inline{margin:0}
@keyframes sheet-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.compare-sheet[open]{animation:none}}
.task{border-top:1px solid var(--border);padding:8px 0}
.task p{margin:0 0 5px}
.welcome,.visit,.compare{border:0;padding:0}
.welcome{max-width:460px;margin:clamp(24px,8vh,78px) auto 40px}
.welcome h1{font-size:clamp(30px,7vw,42px);margin-top:0;letter-spacing:-.04em}
.welcome .muted{margin-bottom:0}
.choices{display:grid;gap:10px;margin:24px 0 16px}
.choices button{text-align:left;min-height:58px;padding-inline:17px;border-radius:13px;font-weight:650}
.choices button:not(.primary){background:#f5f7fa;border-color:transparent}
.choices button:active{transform:scale(.985)}
.choices button{transition:transform 140ms ease,background 140ms ease}
.quiet{border:0;padding-inline:0;background:transparent;color:var(--muted)}
.visit{max-width:520px}
.visit .context,.compare .context{display:block;margin-top:14px;color:var(--muted)}
.visit h1{margin-top:4px}
.visit-progress{margin:24px 0 14px}
.visit-progress p{margin:0 0 6px;font-size:22px;font-weight:700}
.visit-progress strong{font-size:32px;color:var(--blue);font-variant-numeric:tabular-nums}
.visit-progress progress{display:block;width:100%;height:7px;border:0;border-radius:999px;overflow:hidden;appearance:none;background:#edf0f5}
.visit-progress progress::-webkit-progress-bar{background:#edf0f5}
.visit-progress progress::-webkit-progress-value{background:var(--blue);border-radius:999px;transition:width 180ms ease}
.visit-progress progress::-moz-progress-bar{background:var(--blue);border-radius:999px}
.visit-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.visit fieldset.visit-row{margin:0 0 14px;padding:0;border:0;min-width:0}
.visit-row legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.visit-row .visit-tip{margin:0 0 6px}
.visit-row .visit-tip summary{min-height:44px;padding:9px 0}
.visit-row .visit-tip p{margin:0 0 8px}
.visit-options label.visit-option{position:relative;display:block;min-width:0;margin:0}
.visit-option input[type=radio]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.visit-option span{display:grid;place-items:center;min-height:44px;padding:5px 2px;border:1px solid var(--border);border-radius:8px;font-size:14px;text-align:center}
.visit-option input:checked+span{background:var(--wash);border-color:var(--blue);color:#1749bd;font-weight:700}
.visit-option input:checked[value="미확인"]+span{background:#f1f3f6;border-color:#7d8796;color:var(--ink)}
.visit-option input:checked[value="문제 있음"]+span{background:#b42330;border-color:#b42330;color:#fff}
.visit-checklist>summary{font-weight:700}
.visit-option input:focus-visible+span{outline:3px solid #6d9bff;outline-offset:2px}
.visit details>label{margin-top:8px}
.visit form>.primary{width:100%;margin-top:8px}
.compare{max-width:820px;margin-inline:auto}
.compare h1{margin-top:4px}
.listing-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px}
.listing-header h1{margin:0;letter-spacing:-.04em}
.listing-header button{white-space:nowrap;border:0;color:var(--blue);font-weight:750;padding-inline:0}
.listing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,2vw,16px);margin-top:16px}
.listing-grid label.listing-card{display:flex;position:relative;margin:0;border:1px solid #cbd0d9;cursor:pointer}
.listing-grid label.listing-card:has(input:checked){border-color:var(--blue);background:var(--wash)}
.listing-card input[type=checkbox]{position:absolute;top:9px;right:9px;margin:0;width:24px;height:24px}
.listing-delete{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:10px;margin-top:20px}
.listing-delete .quiet{padding-inline:8px}
.listing-delete button:disabled{opacity:.5;cursor:default}
.delete-confirm{background:#b42330;color:#fff;border-color:#b42330;font-weight:700}
.listing-card{display:flex;flex-direction:column;width:100%;min-width:0;text-align:left;gap:8px;padding:clamp(5px,1.2vw,11px);border-color:#cbd0d9;border-radius:12px}
.listing-photo{display:grid;place-items:center;width:100%;aspect-ratio:1.55;overflow:hidden;border-radius:8px;background:#f3f5f8;color:var(--muted)}
.listing-photo img{width:100%;height:100%;object-fit:cover}
.listing-photo[data-demo]{background-image:url('./jeonse-example-rooms.png');background-size:226% auto;background-repeat:no-repeat}
.listing-photo[data-demo="a"]{background-position:6% 19.7%}
.listing-photo[data-demo="b"]{background-position:94.5% 19.7%}
.listing-photo[data-demo="c"]{background-position:6% 75.8%}
.listing-photo[data-demo="d"]{background-position:94.5% 75.8%}
.listing-copy{display:grid;gap:2px;padding:0 3px 4px;overflow-wrap:anywhere;font-size:clamp(13px,3.5vw,18px)}
.listing-copy strong{font-size:clamp(15px,4vw,22px);line-height:1.25;margin-bottom:4px}
.compare-table{overflow-x:auto;margin-top:12px}
.compare-table table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.compare-table th,.compare-table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--border);overflow-wrap:anywhere;vertical-align:middle}
.compare-table thead th{background:#f5f7fa}
.compare-table th[scope=row],.compare-table thead th:first-child{position:sticky;left:0;width:100px;background:#fff;z-index:1;color:var(--muted);font-size:14px}
.compare-table th[scope=col],.compare-table td{width:142px}
.compare-table th button{background:transparent;border:0;text-align:left;padding:0;width:100%;font-weight:700;overflow-wrap:anywhere}
.compare-table .row-action{color:#1749bd;font-weight:650;border-color:transparent;padding-inline:0;text-align:left}
.compare-table small{display:block}
.compare-empty{padding:24px 0;border-block:1px solid var(--border);color:var(--muted)}
.location-map{height:330px;margin:16px 0;border-radius:12px;background:#f5f7fa}
.location-results{padding-left:22px}
.location-results li{margin-bottom:7px}
.wizard{max-width:460px;margin:14px auto 38px;padding:0;border:0;animation:arrive 200ms ease-out}
body:has(.sign-in){min-height:100svh;display:flex;flex-direction:column}
body:has(.sign-in)>header{width:100%}
main:has(.sign-in){width:100%;flex:1;display:grid;align-content:center;padding-block:8px 16px}
main:has(.sign-in)>footer:has(.status:empty){display:none}
.wizard.sign-in{width:100%;margin:0 auto}
.sign-in-gap{height:clamp(0px,calc((100svh - 560px) / 4),53px)}
@media(max-height:620px){
  .sign-in .choices{margin-block:12px 8px}
  .sign-in .account-form{margin-top:8px}
  .sign-in hr{margin-block:12px}
}
.wizard h1{margin:10px 0 8px;letter-spacing:-.035em}
.wizard-icon{font-size:30px;line-height:1;display:block;margin:24px 0 10px}
.wizard .wizard-main{margin:22px 0 12px}
.wizard .primary{width:100%;min-height:52px}
.wizard .wizard-skip{display:block;margin:8px auto 0}
.wizard dl{margin:0 0 20px}
.wizard dl>div{display:grid;grid-template-columns:110px 1fr;gap:12px;border-bottom:1px solid var(--border);padding:10px 0}
.wizard dt{color:var(--muted)}
.wizard dd{margin:0;overflow-wrap:anywhere}
.celebration{text-align:center;margin-top:clamp(24px,8vh,72px)}
.celebration .wizard-icon{font-size:52px;margin:0 auto 18px;animation:celebrate 360ms ease-out}
.celebration h1{margin:12px 0}
.celebration .choices button{text-align:center}
@keyframes celebrate{from{opacity:0;transform:translateY(6px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
.compare summary,.visit summary{color:var(--ink)}
.welcome,.visit,.compare{animation:arrive 180ms ease-out}
@keyframes arrive{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.welcome,.visit,.compare{animation:none}.choices button,.visit-progress progress::-webkit-progress-value{transition:none}.choices button:active{transform:none}}
@media(prefers-reduced-motion:reduce){.wizard,.celebration .wizard-icon{animation:none}}
details{margin:12px 0}
summary{color:#1749bd;cursor:pointer;min-height:44px;padding:10px 0;font-weight:650}
.guide h1{margin-top:16px}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
@media(max-width:540px){.row>*{max-width:100%}.guide .primary{width:100%}}
</style>
<header><strong>전세계약 도우미</strong><div class="account-controls"><small id="sync-status" role="status"></small><button type="button" id="account-button">로그인</button></div></header>
<main id="app"></main>
<div id="save-toast" class="toast" role="status" aria-atomic="true"></div>
<script>
const app = document.getElementById('app');
const saveToast=document.getElementById('save-toast');
const accountButton=document.getElementById('account-button');
const syncStatus=document.getElementById('sync-status');
// 공개 설정만 입력합니다. OAuth 비밀 키와 DB 비밀번호는 Supabase 대시보드에 둡니다.
const cloudConfig={url:'https://mxukstndvgwdzyuoaphh.supabase.co',publishableKey:'sb_publishable_keX60B0nVskJrqRhdMCe3g_DbM70_dK',kakaoMapKey:''};
let authClient=null, accountUser=null, accountLoading=false, accountBusy=false, accountReady=false;
let accountError='', accountEmail='', emailForCode='', cloudVersion=null, pendingCloud=null, syncing=false, syncProblem='', accountEpoch=0;
const cloudConfigured=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cloudConfig.url)&&cloudConfig.publishableKey.startsWith('sb_publishable_');
let toastTimer;
function showToast(message) {
  clearTimeout(toastTimer);
  saveToast.textContent=message;
  toastTimer=setTimeout(()=>{saveToast.textContent='';},2400);
}
const storageKey = 'jeonse-prototype-v1';
const checks = [
  ['water','수압','세면대와 샤워기를 틀어 물줄기가 충분한지 확인해요.'],
  ['drain','배수','세면대와 샤워기 물이 빠지는지, 배수구에 물이 고이거나 역류하지 않는지 봐요.'],
  ['leak','누수','천장 모서리와 창틀, 벽지에 물자국이나 곰팡이 흔적이 있는지 봐요.'],
  ['bugs','벌레','싱크대 아래와 배수구 주변에 벌레나 배설물 흔적이 있는지 살펴봐요.'],
  ['light','채광','가능하면 방 불을 끄고 창으로 들어오는 빛을 확인해요.'],
  ['noise','소음','창문을 열었다 닫으면서 도로와 복도 소리가 얼마나 들리는지 확인해요.'],
  ['climate','냉난방·온수','가능하면 에어컨과 온수를 켜 보고, 보일러가 작동하는지 확인해요.']
];
const results = ['문제 없음','미확인','문제 있음'];
const stageNames = ['조건 확인','계약 전 확인','계약 당일','계약 직후','잔금·입주','입주 후 점검'];
const labels = ['집주인에게 보증금과 입주일을 확인했나요?','계약 전에 확인할 일이 남았나요?','계약서에 합의한 내용이 적혀 있나요?','계약서를 쓴 뒤 무엇을 챙겨야 하나요?','잔금을 보내고 집을 인수할 준비가 됐나요?','입주 후 남은 일을 확인해요'];
const fresh = (id, name, kind, deposit, rent) => ({
  id,name,kind,deposit,rent,nickname:'',address:'',note:'',checks:{},reply:'',date:'',balance:'',move:'',signed:'',finalDeposit:'',finalRent:'',payday:'',done:{},step:0
});
function example() {
  const items = [
    fresh('a','은하수원룸','월세','500','45'),
    fresh('b','창이 큰 원룸','월세','1000','40'),
    fresh('c','햇살 좋은 집','전세','8000',''),
    fresh('d','조용한 원룸','월세','300','48')
  ];
  items[0].checks={water:'문제 없음',bugs:'문제 없음'};
  items[1].checks={leak:'문제 있음',water:'문제 없음'};
  items[1].note='욕실 천장에 물이 샌 흔적이 있었어요.';
  return items;
}
const sampleIds = new Set(example().map(item=>item.id));
function emptySearch() {
  return {items:[],chosen:null,last:null,compare:['leak','bugs']};
}
function normalizeSearch(data) {
  if(!Array.isArray(data?.items))return emptySearch();
  for(const [id,name,nickname] of [['a','후보 A','쪽문 근처'],['b','후보 B','후문 근처'],['c','후보 C','원룸']]) {
    const saved=data.items.find(item=>item.id===id);
    if(saved&&saved.nickname===undefined&&saved.name===name+' · '+nickname) {
      saved.name=name;
      saved.nickname=nickname;
    }
  }
  return data;
}
function readGuestSearch() {
  try {return normalizeSearch(JSON.parse(localStorage.getItem(storageKey)));}
  catch {return emptySearch();}
}
let state=readGuestSearch();
let guestImport=null;
let saveError=false;
function save() {
  if(accountUser){
    pendingCloud=structuredClone(state);
    saveError=false;
    void syncCloud();
    return;
  }
  try {localStorage.setItem(storageKey,JSON.stringify(state));saveError=false;}
  catch {saveError=true;}
  const status=app.querySelector('[role=status]');
  if(status)status.textContent=saveError?'브라우저에 저장할 수 없어요. 현재 화면에서만 기록이 유지돼요.':'';
}
function updateAccountControls() {
  accountButton.hidden=!accountUser||screen==='account';
  accountButton.textContent=accountUser?'내 계정':'로그인';
  syncStatus.textContent=accountLoading?'로그인 확인 중':syncProblem?'동기화 확인 필요':syncing?'저장 중':accountReady?'계정에 저장됨':'';
}
async function syncCloud() {
  if(!accountReady||syncing||syncProblem||!pendingCloud)return;
  const epoch=accountEpoch, userId=accountUser.id;
  syncing=true;
  updateAccountControls();
  try {
    while(epoch===accountEpoch&&pendingCloud){
      const payload=pendingCloud;
      const table=authClient.from('jeonse_workspaces');
      const result=cloudVersion===null
        ?await table.insert({user_id:userId,payload}).select('version').single()
        :await table.update({payload,version:cloudVersion+1}).eq('user_id',userId).eq('version',cloudVersion).select('version').maybeSingle();
      if(epoch!==accountEpoch)return;
      if(result.error?.code==='23505'||(!result.error&&!result.data)){
        syncProblem='conflict';
        break;
      }
      if(result.error)throw result.error;
      cloudVersion=result.data.version;
      if(guestImport&&payload.guestImports?.includes(guestImport.id)){
        try {
          if(localStorage.getItem(storageKey)===guestImport.raw)localStorage.removeItem(storageKey);
        } catch {}
        guestImport=null;
      }
      if(pendingCloud===payload)pendingCloud=null;
    }
  } catch {
    if(epoch===accountEpoch)syncProblem='network';
  } finally {
    if(epoch===accountEpoch){
      syncing=false;
      updateAccountControls();
      if(screen==='account')render();
    }
  }
}
async function loadCloud(user) {
  const epoch=++accountEpoch;
  accountUser=user;
  accountReady=false;
  accountLoading=!!user;
  syncing=false;
  syncProblem='';
  pendingCloud=null;
  guestImport=null;
  cloudVersion=null;
  saveError=false;
  accountReturn=null;
  if(!user){
    state=readGuestSearch();
    go('account');
    return;
  }
  state=emptySearch();
  updateAccountControls();
  render();
  try {
    const {data,error}=await authClient.from('jeonse_workspaces').select('payload,version').eq('user_id',user.id).maybeSingle();

async function readListingPhoto(file) {

  const bitmap=await createImageBitmap(file).catch(()=>{throw Error('사진을 열 수 없어요. 다른 사진을 골라 주세요.');});
  try {
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);

function mapSdk() {

async function lookupLocation({query,pin}={}) {

  const registering=screen==='registration';

  const result=app.querySelector('[data-location-result]');
  const saveButton=app.querySelector('[data-action="save-location"]');

  saveButton.hidden=true;
  result.textContent='지도에서 위치를 확인하는 중이에요.';
  try {
    const maps=await mapSdk();
    if(!locationCurrent(request,id))return;
    const geocoder=new maps.services.Geocoder();
    let point=pin, address='';

      const matches=await mapService(maps,done=>geocoder.addressSearch(query,done));
      if(!locationCurrent(request,id))return;
      if(!matches.length)throw Error('주소를 찾지 못했어요. 시·구를 포함해 입력하거나 지도에서 직접 찍어 주세요.');
      const exact=matches.find(match=>match.address_name===query||match.road_address?.address_name===query);
      if(!exact&&matches.length>1)throw Error('같은 이름의 주소가 여러 곳이에요. 시·구까지 입력하거나 지도에서 직접 찍어 주세요.');
      const match=exact||matches[0];
      point=new maps.LatLng(Number(match.y),Number(match.x));
      address=match.road_address?.address_name||match.address_name;
    }
    if(!point&&item.location) {
      point=new maps.LatLng(item.location.lat,item.location.lng);
      address=item.location.address;
    }
    if(!point){
      displayMap(maps,36.4,127.8,13);
      result.textContent='지도를 확대해 매물이 있는 곳을 찍어 주세요.';
      return;
    }
    const lat=point.getLat(), lng=point.getLng();
    const {map,marker}=displayMap(maps,lat,lng);
    map.setCenter(point);
    map.setLevel(4);
    marker.setPosition(point);
    marker.setMap(map);
    result.textContent='가까운 역과 학교를 찾는 중이에요.';
    const places=new maps.services.Places();
    const [nearby,addresses]=await Promise.all([
      registering?[]:Promise.all(nearbyCategories.map(async ([code,label])=>{
        const options={location:point,radius:2000,sort:maps.services.SortBy.DISTANCE,size:1};

async function runAccountAction(work) {

  accountBusy=true;
  accountError='';
  app.setAttribute('aria-busy','true');
  try {await work();}
  catch(error){accountError=error.message;}
  finally {
    accountBusy=false;
    app.removeAttribute('aria-busy');
    if(screen==='account')render();
  }
}

function importGuestSearch() {
  if(!accountReady||syncProblem||syncing||pendingCloud)return;
  const guest=readGuestSearch();
  if(!guest.items.length)return;
  guest.importId??=crypto.randomUUID();
  const raw=JSON.stringify(guest);
  try {localStorage.setItem(storageKey,raw);}
  catch {
    accountError='이 기기의 기록을 옮길 준비를 하지 못했어요.';
    render();
    return;
  }
  if(state.guestImports?.includes(guest.importId)){
    try {localStorage.removeItem(storageKey);} catch {}
    render();
    return;
  }
  guestImport={id:guest.importId,raw};
  const hasItems=state.items.length>0;
  const importedIds=new Map(guest.items.map(item=>[item.id,crypto.randomUUID()]));
  state.items.push(...guest.items.map(item=>({...item,id:importedIds.get(item.id)})));
  state.chosen??=importedIds.get(guest.chosen)??null;
  state.last??=importedIds.get(guest.last)??null;
  if(!hasItems){
    state.compare=guest.compare;
  }
  state.guestImports=[...(state.guestImports??[]),guest.importId];
  save();
  render();
}

const registryTerms=[
  ['근저당권',/근저당권|근저당/,'집을 담보로 설정할 수 있는 권리예요.','해당 줄이 말소됐는지, 남아 있다면 채권최고액과 내 보증금보다 우선하는 권리를 확인해요.'],
  ['채권최고액',/채권최고액/,'근저당으로 담보하는 채권의 상한이에요.','현재 대출 잔액은 별도로 확인하고, 등기에 적힌 금액은 원본과 대조해요.'],
  ['압류',/(?<!가)압류/,'채권 회수 등을 위해 재산 처분에 제한을 두는 기록일 수 있어요.','갑구에서 기록의 대상과 말소 여부를 확인하고 계약금 송금 전에 설명을 받아요.'],
  ['가압류',/가압류/,'재산을 미리 보전하기 위한 조치예요.','등기의 해당 기록이 남아 있는지 확인하고 계약 전에 전문가에게 문의해요.'],
  ['신탁',/신탁/,'부동산의 소유권과 관리 권한을 확인해야 하는 기록이에요.','신탁원부에서 계약할 권한이 있는 사람과 필요한 동의 여부를 확인해요.'],
  ['경매',/경매개시결정|경매/,'부동산을 경매로 매각하는 절차와 관련된 문구예요.','갑구에서 경매개시결정이 현재 남아 있는지 확인해요.'],
  ['임차권등기',/임차권등기|임차권설정/,'세입자의 임차권이 등기에 기록된 경우예요.','기록이 남아 있는지와 내 보증금에 앞서는 권리가 있는지 확인해요.'],
  ['전세권',/전세권/,'등기에 설정할 수 있는 전세 관련 권리예요.','전세권의 대상 범위, 순위, 말소 여부를 확인해요.']
];
function findRegistryTerms(text) {
  const lines=text.normalize('NFKC').split(/\r?\n/).map(line=>line.replace(/\s/g,''));
  return registryTerms.filter(([,pattern])=>lines.some(line=>pattern.test(line)));
}
let ocrLibrary;
function loadOcrLibrary() {
  if(window.Tesseract?.createWorker)return Promise.resolve(window.Tesseract);
  ocrLibrary??=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    const fail=()=>{
      clearTimeout(timeout);
      script.remove();
      reject(Error('한글 인식 도구를 내려받지 못했어요. 인터넷 연결을 확인해 주세요.'));
    };
    const timeout=setTimeout(fail,20000);
    script.src='https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
    script.onerror=fail;
    script.onload=()=>{
      if(!window.Tesseract?.createWorker)return fail();
      clearTimeout(timeout);
      resolve(window.Tesseract);
    };
    document.head.append(script);
  }).catch(error=>{ocrLibrary=null;throw error;});
  return ocrLibrary;
}
async function scanRegistry(form,values) {
  const result=app.querySelector('[data-scan-result]');
  if(!values.image?.size||values.image.size>8*1024*1024||!['image/jpeg','image/png','image/webp'].includes(values.image.type)){
    result.textContent='8MB 이하의 JPG, PNG 또는 WebP 사진을 골라 주세요.';
    return;
  }
  const button=form.querySelector('button');
  button.disabled=true;
  let worker;
  result.textContent='한글 인식 도구를 준비하고 있어요.';
  try {
    const engine=await loadOcrLibrary();
    if(!form.isConnected)return;
    worker=await engine.createWorker('kor',1,{logger:progress=>{
      if(progress.status==='recognizing text')result.textContent='사진에서 글자를 읽고 있어요. '+Math.round(progress.progress*100)+'%';
    },errorHandler:()=>{}});
    if(!form.isConnected)return;
    const {data}=await worker.recognize(values.image);
    const findings=findRegistryTerms(data.text);
    result.innerHTML=`<h2>사진에서 찾은 용어</h2>
      ${data.confidence<65?'<p>일부 글자를 읽기 어려워요. 밝고 선명하게 다시 찍으면 더 잘 읽을 수 있어요.</p>':''}
      ${findings.length?findings.map(([term,,meaning,check])=>`<div class="note">
        <h3>${term}</h3><p><strong>뜻</strong> · ${meaning}</p>
        <p><strong>확인할 점</strong> · ${check}</p></div>`).join(''):
        '<p>이 사진에서 표시할 용어를 찾지 못했어요. 인식에서 빠진 문구가 있을 수 있으니 원본도 확인해 주세요.</p>'}
      <p class="muted">표시된 용어를 원본에서 찾고, 해당 기록이 말소됐는지 확인해 주세요.</p>`;
  } catch {
    result.textContent='사진을 읽지 못했어요. 인터넷 연결을 확인하거나 더 선명한 사진으로 다시 시도해 주세요.';
  } finally {
    if(worker)await worker.terminate().catch(()=>{});
    button.disabled=false;
  }
}
function render() {
  const item=state.items.find(p=>p.id===active);
  updateAccountControls();
  if(accountLoading) app.innerHTML='<section class="wizard"><h1>기록을 불러오고 있어요</h1></section>';
  else if(screen==='account'||(accountUser&&!accountReady)) app.innerHTML=renderAccount();
  else if(screen==='registration') app.innerHTML=renderRegistration();
  else if(screen==='registry-scan'&&item) app.innerHTML=renderRegistryScan(item);
  else if(screen==='location'&&item) app.innerHTML=renderLocation(item);
  else if(screen==='welcome') app.innerHTML=renderWelcome();
  else if(screen==='picker') app.innerHTML=renderPicker();
  else if(screen==='detail') app.innerHTML=renderDetail(item);
  else if(screen==='celebration'&&item) app.innerHTML=renderCelebration(item);
  else if(screen==='guide'&&item) app.innerHTML=renderGuide(item);
  else app.innerHTML=renderList();
  app.insertAdjacentHTML('beforeend',`<footer><div class="status" role="status">${saveError?'이 브라우저에 저장할 수 없어요.':''}</div></footer>`);
}
accountButton.addEventListener('click',()=>{

});

      if(deleteSelection.has(state.last))state.last=null;
      save();
      go('list');

    case 'guest-cancel': app.querySelector('#guest-dialog').close();break;
    case 'guest-confirm':

      emailForCode='';

      go('welcome');break;
    case 'import-guest': importGuestSearch();break;
    case 'social-login':
      void runAccountAction(async ()=>{

        if(error)throw Error('로그인 페이지를 열지 못했어요. 연결 설정을 확인해 주세요.');
      });break;
    case 'resend-code': if(emailForCode)void requestCode(emailForCode);break;
    case 'change-email': emailForCode='';accountError='';render();break;
    case 'cloud-retry': syncProblem='';void syncCloud();render();break;
    case 'cloud-reload':
      if(!accountUser||syncing)break;
      if(pendingCloud&&!confirm('이 기기에서 아직 저장되지 않은 변경 사항을 버리고 서버 기록을 불러올까요?'))break;
      void loadCloud(accountUser);break;
    case 'sign-out':
      if(pendingCloud||syncing){
        accountError='저장 중인 변경 사항이 있어요. 저장 결과를 먼저 확인해 주세요.';
        render();break;
      }
      void runAccountAction(async ()=>{
        const {error}=await authClient.auth.signOut({scope:'local'});
        if(error)throw Error('로그아웃하지 못했어요. 다시 시도해 주세요.');
        emailForCode='';
        accountEmail='';
        if(accountUser)await loadCloud(null);
      });break;
    case 'welcome': case 'list': go(command); break;
    case 'location': ++locationRequest;locationDraft=null;go('location',id);break;
    case 'pick-map': lookupLocation();break;
    case 'save-location':
      if(!locationDraft)break;

      }

      item.location=locationDraft;
      if(locationDraft.address)item.address=locationDraft.address;

    case 'search-start': go('list'); break;

    case 'pick': {

    case 'registration-skip':

      registration.id=crypto.randomUUID?.()??Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
      registration.name=registration.name.trim()||nextCandidateName();

    case 'guide-kind':

    case 'detail': case 'guide': state.last=id;save();go(command,id);break;
    case 'choose': app.querySelector('#contract-dialog').showModal();break;
    case 'cancel-contract': app.querySelector('#contract-dialog').close();break;

    }

      const steps=prepQuestions(item);
      const index=prepIndex(item,steps);
      const question=steps[index];

app.addEventListener('input',event=>{
  const input=event.target;

});
function showAmountError(input) {
  const validity=input.validity;
  const message=validity.rangeUnderflow?'0 이상 입력해 주세요.':
    validity.badInput?'숫자로 입력해 주세요.':
    validity.valueMissing?'금액을 입력해 주세요.':
    validity.stepMismatch?'소수 둘째 자리까지 입력해 주세요.':'';
  const error=document.getElementById(input.dataset.amountError);
  error.hidden=!message;
  error.textContent=message;
  if(message)input.setAttribute('aria-invalid','true');
  else input.removeAttribute('aria-invalid');
}
app.addEventListener('invalid',event=>{
  const input=event.target;
  if(!input.dataset.amountError)return;
  event.preventDefault();
  showAmountError(input);
  if(input.form.querySelector(':invalid')===input)input.focus();
},true);
app.addEventListener('change',event=>{
  const input=event.target;

    const file=input.files[0];
    input.value='';
    if(!file)return;
    const draft=registration;
    const error=app.querySelector('[data-registration-photo-error]');
    void readListingPhoto(file).then(photo=>{
      if(!error.isConnected||registration!==draft)return;
      draft.photo=photo;
      registrationMove(1);
    }).catch(reason=>{error.textContent=reason.message;});
    return;
  }
  if(deleteMode&&input.dataset.deleteId){
    if(input.checked)deleteSelection.add(input.dataset.deleteId);
    else deleteSelection.delete(input.dataset.deleteId);
    app.querySelector('[data-delete-count]').textContent='선택한 매물 '+deleteSelection.size+'개';
    app.querySelector('[data-action="confirm-delete"]').hidden=!deleteSelection.size;
    return;
  }
  if(input.hasAttribute('data-visit-check')) {
    const item=state.items.find(p=>p.id===active);
    item.checks[input.name]=input.value;
    const count=checkedCount(item);
    app.querySelector('[data-visit-count]').textContent=count;
    app.querySelector('.visit-progress progress').value=count;
    save();
  }
  if(input.dataset.task) {
    const item=state.items.find(p=>p.id===active);
    item.done[input.dataset.task]=input.checked;save();
    if(input.checked){
      const row=input.closest('.task');
      const focused=document.activeElement===input;
      input.disabled=true;
      const next=app.querySelector('.task input:not(:disabled), [data-action="next"]');
      if(focused)(next||app.querySelector('h1')).focus({preventScroll:true});
      const remove=()=>{
        if(!row.isConnected)return;
        const container=row.parentElement;
        row.remove();
        if(!container.querySelector('.task')){
          const message=document.createElement('p');
          message.className='muted';
          message.textContent='이 단계에서 확인할 일을 모두 마쳤어요.';
          container.querySelector('h1').after(message);
        }
      };
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)remove();
      else {
        row.classList.add('task-done');
        setTimeout(remove,650);
      }
    }
  }
});
app.addEventListener('submit',event=>{
  const form=event.target;
  if(!form.dataset.form)return;
  event.preventDefault();
  const values=Object.fromEntries(new FormData(form));
  let item=state.items.find(p=>p.id===active);
  switch(form.dataset.form) {
    case 'registry-scan': void scanRegistry(form,values);return;
    case 'listing-photo': void saveListingPhoto(item,form,values.photo);return;
    case 'email-code': void requestCode(values.email.trim());return;
    case 'verify-code':
      if(!emailForCode)return;
      void runAccountAction(async ()=>{
        const {error}=await authClient.auth.verifyOtp({email:emailForCode,token:values.code.trim(),type:'email'});
        if(error)throw Error('코드가 맞는지 확인해 주세요. 만료됐다면 다시 받을 수 있어요.');
        emailForCode='';
      });return;
    case 'registration-value':
      if(!values.value.trim())return;
      registration[registrationStep]=values.value.trim();
      registrationMove(1);return;
    case 'location-search':
      if(values.query.trim())lookupLocation({query:values.query.trim()});
      return;
    case 'save-manual-address': {
      const address=values.address.trim();
      if(!address)return;
      const target=screen==='registration'?registration:item;
      if(target.address!==address)delete target.location;
      target.address=address;
      if(screen==='registration')registrationMove(1);
      else {save();go('detail',item.id);}
      return;
    }
    case 'visit-memo':
      item.note=values.note;
      save();render();
      showToast(saveError?'방문 메모를 저장할 수 없어요.':accountUser?'방문 메모를 계정에 저장 중이에요.':'방문 메모를 저장했어요.');
      return;
    case 'property':
      if(!values.name.trim()) {form.elements.name.focus();return;}
      if(item.address!==values.address)delete item.location;
      for(const key of ['name','nickname','kind','deposit','rent','address'])item[key]=values[key];
      item.nickname=item.nickname.trim();
      state.last=item.id;
      save();go('detail',item.id);
      app.querySelector('[role=status]').textContent=saveError?'저장할 수 없어요.':'이 매물의 기록을 저장했어요.';return;
    case 'signed': {
      const firstSigning=!item.signed;
      Object.assign(item,values);
      item.step=3;
      save();
      go(firstSigning?'celebration':'guide',item.id);
      return;
    }
    default: Object.assign(item,values);
  }
  save();render();
  app.querySelector('[role=status]').textContent=saveError?'저장할 수 없어요.':'저장했어요.';
});
